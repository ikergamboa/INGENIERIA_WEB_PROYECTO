{% extends 'base.html' %}

{% block content %}
  <h2>Mis Pedidos</h2>

  {% if pedidos %}
    <ul>
      {% for pedido in pedidos %}
        <li>
          <strong>Pedido #{{ pedido.id }}</strong> - 
          <strong>Plato:</strong> {{ pedido.plato.nombre }} ({{ pedido.cantidad }} ud/s) 
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Aún no has realizado ningún pedido.</p>
  {% endif %}
{% endblock %}
